# Vyplnte skutocnu adresu WEBU a tri rozne ucty z PHP fixtures.
# Subor sa cita ako UTF-8. Hodnoty nedavajte do uvodzoviek.
base.url=http://127.0.0.1:8080/
browser=chrome
headless=false
timeout.seconds=30
cleanup.order=true

# Volitelne absolutne cesty. Vo Windows pouzite / alebo escapovane \\.
# Prazdna hodnota driver.path znamena automaticky Selenium Manager.
driver.path=
browser.binary=

# Tri SAMOSTATNE priestory: v PHP projekte 3x php bin/fixtures.php create
run.1.workspace=SEM_WORKSPACE_1
run.1.email=SEM_EMAIL_1
run.1.password=SEM_PASSWORD_1

run.2.workspace=SEM_WORKSPACE_2
run.2.email=SEM_EMAIL_2
run.2.password=SEM_PASSWORD_2

run.3.workspace=SEM_WORKSPACE_3
run.3.email=SEM_EMAIL_3
run.3.password=SEM_PASSWORD_3
